# Test of a checkpoint (test_cond.py). Layered on top of the checkpoint's own
# training config; the command line wins over both.

sampling:
  n_metrics_samples: 512     # a number | all | 0 (panels only)
  n_test_panels: 8           # 0 = none
  n_probe_panels: 8          # 0 = none
  n_audio_samples: 4
  metrics_samples_per_forward: 32  # 0 = serial sampler; N = N samples per forward

metrics:
  decode_batch: 8            # clips decoded (and CLAP-embedded) together
