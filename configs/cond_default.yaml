# configs/cond_default.yaml  (IRCAM-ported)
#
# Default configuration for the conditioned Audio DiT training (training_cond.py).
#
# IRCAM PORTING NOTES (only the `paths` block changed vs the Windows version):
#   - All paths are ABSOLUTE and live on the machine-LOCAL disk
#     (/data/anasynth_nonbp/baione/...), NEVER on the NFS HOME (/u/anasynth/...).
#   - runs_dir and cache_dir were "runs" / "cache" (relative -> cwd -> HOME on
#     IRCAM). Made absolute on local disk so a forgotten CLI override cannot
#     write training data onto NFS (which would saturate the network).
#   - You still SHOULD pass paths.* explicitly on the command line per dataset
#     (the launch pattern from the unconditional project); these defaults are
#     just a safe fallback.
#   - Adjust the dataset folder name to whatever you actually extracted
#     (e.g. dataset_ready_full for museart). conditions/ must have been produced
#     by extract_conditions.py.
#
# Launch:
#   python launch_training_cond.py --run_name "cond_S_melody" \
#       paths.dataset_root=/data/anasynth_nonbp/baione/dataset_ready_cond/latents \
#       paths.wav_root=/data/anasynth_nonbp/baione/dataset_ready_cond/wav \
#       paths.condition_root=/data/anasynth_nonbp/baione/dataset_ready_cond/conditions \
#       paths.cache_dir=/data/anasynth_nonbp/baione/cache_cond
#
# Resume:
#   python launch_training_cond.py --run_name "cond_S_melody" \
#       --resume /data/anasynth_nonbp/baione/runs_cond/<prev>/checkpoints/checkpoint_step50000.pt


# ============================================================
# MODEL
# ============================================================
model:
  kind: 'S'              # S | B | G | L  (see network_cond.py)
  duration_s: 5.0        # seconds of audio per chunk
  drop: 0.0              # dropout in the FFN of every DiT block (0 -> inert)


# ============================================================
# DATA
# ============================================================
data:
  train_batch_size: 8
  val_batch_size: 8
  grad_accum: 1
  num_val_batches: 8     # number of validation batches per validation pass


# ============================================================
# TRAINING
# ============================================================
training:
  num_steps: 500000
  lr: 1.0e-4

  weight_decay: 0.0       # 0 disables weight decay in AdamW
  grad_clip:    0.0       # <= 0 disables gradient clipping (norm still logged)
  use_amp:      false     # false runs everything in fp32 (TF32 in matmul)

  # Schedule LR
  warmup_steps: 5000
  decay_start_frac: 0.8   # cosine decay from step (num_steps * decay_start_frac)

  # EMA
  use_ema:    true
  ema_decay:  0.9999
  ema_start:  5000


# ============================================================
# INTERVALS (in training steps)
# ============================================================
intervals:
  val:     1000
  audio:   25000
  audio_preview: false
  metrics: 50000
  ckpt:    25000          # lowered from 50000 for blackout protection (mirrors uncond advice)
  keep_last_n_ckpts: 5


# ============================================================
# SAMPLING (Euler / rectified flow)
# ============================================================
sampling:
  euler_steps: 50
  t_min: 0.001
  t_max: 0.999
  n_audio_samples: 4
  n_metrics_samples: 128
  metrics_uncond: true


# ============================================================
# CONDITIONING
# ============================================================
conditioning:
  p_drop_all:    0.10
  p_drop_frame:  0.05
  p_drop_global: 0.05
  guidance_scale: 3.0

  # FIRST TEST: melody only, no global conditions.
  enabled_frame:  ["melody"]
  enabled_global: []


# ============================================================
# PATHS  (IRCAM: absolute, machine-LOCAL disk only)
# ============================================================
paths:
  # Output of preprocess_dataset.py + extract_conditions.py
  dataset_root:   "/data/anasynth_nonbp/baione/dataset_ready_cond/latents"
  wav_root:       "/data/anasynth_nonbp/baione/dataset_ready_cond/wav"
  condition_root: "/data/anasynth_nonbp/baione/dataset_ready_cond/conditions"

  # Class-organised image folders (image_root/<class>/*.jpg). Optional.
  image_root:     "/data/anasynth_nonbp/baione/image_dataset_cond"

  # Runs and cache: ABSOLUTE on local disk (NEVER relative -> never on HOME NFS).
  runs_dir:       "/data/anasynth_nonbp/baione/runs_cond"
  cache_dir:      "/data/anasynth_nonbp/baione/cache_cond"

  run_name:       null
  resume_from:    null
