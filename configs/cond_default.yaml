# configs/cond_default.yaml
#
# Default configuration for the conditioned Audio DiT training (training_cond.py).
#
# Mirrors the structure of configs/uncond_default.yaml (model / data / training
# / intervals / sampling / metrics / paths) and adds a `conditioning` section for
# the multi-modal conditioning specific to this project:
#   - frame-level conditions (f0, chroma, rhythm, energy) are CONCATENATED on
#     the feature dimension at the model input, JASCO-style (see network_cond.py);
#   - global conditions (text-CLAP, image-CLIP) are injected via AdaLN, exactly
#     as the class label in the official DiT;
#   - per-sample CFG dropout during training;
#   - classifier-free guidance during validation (audio + metrics).
#
# Name of the experiment (organises runs on disk and in TensorBoard):
#   python training_cond.py --run_name "cond_S_f0"
#   (default: timestamp YYYY-MM-DD_HH-MM-SS)
#
# To resume a training (a new run starts from the given checkpoint):
#   python training_cond.py --resume runs/<prev_run>/checkpoints/checkpoint_step50000.pt
#
# Override on the CLI with dotlist syntax, e.g.:
#   python training_cond.py --config configs/cond_default.yaml \
#       --run_name "cond_S_f0" model.kind=S training.num_steps=500000
#
# The project-wide pool of available conditions lives in CONDITION_CONFIG in
# conditions.py. What lives in YAML is the per-run SELECTION of a subset of that
# pool (see `conditioning.enabled_frame` / `conditioning.enabled_global`). The
# final set is persisted into each checkpoint via `frame_cond_dims`,
# `frame_cond_out_dims` and `global_configs`, so sampling and editing can reload
# it without the YAML.


# ============================================================
# MODEL
# ============================================================
model:
  kind: 'S'              # S | B | G | L | XL  (see network_cond.py)
  duration_s: 5.0        # seconds of audio per chunk
  drop: 0.0              # dropout in the FFN of every DiT block (0 -> inert)

  # ---------------------------------------------------------------
  # PER-BLOCK RE-INJECTION of the frame conditions (f0/chroma/rhythm/energy).
  #
  #   0  -> OFF: the frame conditions are concatenated at the input and never
  #         presented again (plain JASCO). This is the HISTORICAL behaviour, and
  #         the only value that is bit-comparable with runs trained before the
  #         re-injection existed.
  #   1  -> re-inject before EVERY block   <- the value set below
  #   2  -> before every other block, 4 -> every fourth, ...
  #
  # WHY IT EXISTS. With 0, a frame condition touches exactly ONE matrix
  # (input_proj) and then has to survive the whole depth inside the residual
  # stream, while a GLOBAL condition modulates all N blocks and the final layer
  # through AdaLN -- 6 points of contact on 'S', 28 on 'XL'. Music ControlNet
  # (Wu et al. 2024) makes the opposite choice and keeps feeding the temporal
  # control back into the trunk. This is that path: the projected conditions are
  # re-added to the hidden state before the selected blocks through a per-block
  # zero-initialised, bias-free Linear. Zero-init means step 0 is EXACTLY the
  # input-only model (verified in network_cond.py's __main__), so the extra path
  # is learned only if it earns its weight.
  #
  # PER-CONDITION GATE. The re-injected term is scaled by a gate read off the
  # AdaLN vector c -- one scalar PER FRAME CONDITION, per selected block:
  #
  #     h <- h + W_i . ( frame_proj * g_i )      g_i = W_g,i . SiLU(c)
  #
  # Without it the term re-added at a given block would be a function of the
  # conditions alone, i.e. the SAME tensor at every denoising step, while every
  # other path in the network -- each block's own shift/scale/gate, and the
  # global conditions that ride inside c -- is free to weigh itself against t.
  # So each condition can be pushed harder at high noise and eased off near the
  # data, or the reverse; the gradient decides. Two consequences worth knowing:
  #
  #   * f0 and chroma get SEPARATE scalars, so they no longer necessarily rise
  #     and fall together. (Before the gate the add operated on their
  #     concatenation and could only be weighted as one block.)
  #   * the gate reads c, so with conditioning.enabled_global non-empty the
  #     amount of frame condition injected also depends on text/image. This is
  #     deliberate -- it is the DiT's own single-conditioning-vector design --
  #     and it is inert when there are no global conditions, where c IS the
  #     timestep embedding.
  #
  # The gate is initialised to the IDENTITY (weight 0, bias 1), NOT to zero:
  # zeroing both it and the projection would leave the path with no gradient on
  # either side, permanently. Step 0 is still exactly the input-only model,
  # because that guarantee comes from the zero-init projection.
  #
  # It is inert (and says so at build time) when conditioning.enabled_frame is
  # empty.
  #
  # COST: one Linear(sum(out_dim) -> hidden) per selected block, plus a
  # Linear(hidden -> n_conditions) for its gate. With f0 alone (out_dim 16) on
  # 'XL' that is 27 x 16 x 1152 = 0.5M params for the projections and 31k for
  # the gates, together ~0.05% of the model; with all four frame conditions
  # (sum 128) the projections are 4.0M. On 'S' with f0 alone: 40 960 + 2 565
  # = 0.04M, 0.14% of the model. Compute is one extra matmul per selected block.
  #
  # ARCHITECTURE PARAMETER: it changes the state_dict, so it lives here next to
  # `kind` and is checked on --resume exactly like `kind`. A checkpoint trained
  # with one value cannot be resumed with another. A checkpoint trained with
  # re-injection BEFORE the gate existed is also refused, with an explanation
  # (network_cond.check_ckpt_reinject_gate): same stride, different weights.
  # ---------------------------------------------------------------
  frame_reinject_every: 1

  # ---------------------------------------------------------------
  # TEXT CROSS-ATTENTION  (PixArt-alpha)
  # ---------------------------------------------------------------
  # 0  -> OFF. The text reaches the blocks ONLY as a pooled vector summed into
  #       the AdaLN conditioning vector c. From c come shift/scale/gate, which
  #       `modulate` broadcasts over time -- so the text can apply one affine
  #       transform, the same at every frame. No word can act on frame 200
  #       differently from frame 10, because the text never enters an attention
  #       at all.
  # 1  -> a cross-attention in EVERY block; 2 -> every other block, and so on.
  #       Each audio token queries the text SEQUENCE: Q from x, K and V from the
  #       token states of the caption. The conditioning becomes time-varying,
  #       content-dependent (Q is a function of x, so the same word weighs
  #       differently at different points and at different depths), and its
  #       capacity grows with the length of the text instead of being squeezed
  #       into one vector that also shares a channel with the timestep.
  #
  # WHERE IT SITS: between the self-attention and the FFN, the order of
  # PixArt-alpha and of the LDM/Stable-Diffusion block. It takes NO AdaLN
  # modulation of its own -- it reads the text directly -- and no positional
  # encoding on the context: RoPE rotates by position in the AUDIO sequence, and
  # the text keys are not at any audio position.
  #
  # WHAT IT NEEDS FROM THE DATASET: global_conditions/text_labels_tok.npy, the
  # captions as token sequences. A run with text_cross_every > 0 on a dataset
  # that has none REFUSES TO START rather than attending to the null token for
  # a week. Re-run the preprocessing on the same output dir with --global_conds text:
  # it rewrites only the sidecar and touches no audio.
  #
  # COST: about +19% parameters on 'L' with a stride of 1 (+88M on 467M), and
  # the optimizer state grows with them.
  #
  # ARCHITECTURE PARAMETER: it changes the state_dict, so it is checked on
  # --resume exactly like `kind` and `frame_reinject_every`. To turn it ON for a
  # run that is already trained, do NOT resume -- use paths.init_from, which
  # warm-starts from those weights; the output projection is zero-initialised,
  # so the model starts as the exact same function it was.
  text_cross_every: 0


# ============================================================
# DATA
# ============================================================
data:
  train_batch_size: 8
  val_batch_size: 16
  grad_accum: 1
  num_val_batches: 89       # max fixed validation batches (89 x 16 covers all 1421 val samples; last batch is partial)
  validation_shuffle: true  # deterministic shuffle before selecting the fixed subset
  validation_seed: 12345    # fixed subset/noise; live and EMA get the same exam
  num_workers: 4         # DataLoader workers; set 0 on Windows or for simple/debug runs

  # ----------------------------------------------------------------
  # TRAIN / VAL / TEST split: THERE IS NOTHING TO CONFIGURE HERE ANY MORE.
  #
  # The split is decided by preprocess_stream.py -- over the SOURCE FILES, before
  # anything is encoded -- and recorded in <dataset_root>/../splits.json. The
  # training READS that file (audio_dataset_npy.load_source_split). Ratios, seed
  # and stratification are set in configs/preprocess_default.yaml, once, with the
  # dataset; they are not a per-run knob, because a split that can be re-decided
  # at startup is a split that can silently move a training source into the test
  # set between two runs of the same experiment.
  #
  # The recorded ASSIGNMENT (not just its parameters) is part of the cached
  # normalizer / FD-DAC fingerprint: if the split changes, or new sources are
  # assigned into it, the cache is refused as stale and a fresh paths.cache_dir
  # is required -- the normalizer is fitted on the train split.
  #
  # A dataset built before this change has no splits.json; create it once with
  #   python preprocess_stream.py SRC OUT --import_legacy_split
  # which reproduces the split the training used to compute in-code, so a run
  # already in flight keeps exactly the same val/test sets.
  # ----------------------------------------------------------------


# ============================================================
# TRAINING
# ============================================================
training:
  num_steps: 1000001
  lr: 1.0e-4
  seed: 42                # global run seed: x0, t-sampling, CFG dropout, DataLoader
                          # shuffle. null = off (free-running). Matches uncond.

  # If true (default), the training gives an error if any requested frame
  # condition is not present in EVERY train/val .npz (full scan), and the
  # dataset hard-fails instead of silently zero-filling a missing/corrupt
  # condition. Set false only for debug runs where NULL conditions are OK.
  strict_conditions: true

  # Regularization / numerical guards.
  # All three are KEPT AS CONFIGURABLE OPTIONS but DISABLED for this training:
  # the next run is meant to mirror the configuration used by the official DiT
  # (facebookresearch/DiT), where TF32 + fp32 + AdamW(wd=0) + no clip proved
  # stable over millions of steps without any NaN event. They can be re-enabled
  # later from this YAML or via CLI override (e.g. training.use_amp=true).
  weight_decay: 0.0       # 0 disables weight decay in AdamW
  grad_clip:    0.0       # <= 0 disables gradient clipping (norm still logged)
  use_amp:      false     # false runs everything in fp32 (TF32 in matmul)

  # Schedule LR
  warmup_steps: 5000
  decay_start_frac: 0.8   # cosine decay from step (num_steps * decay_start_frac)

  # EMA
  use_ema:    true        # if false, no EMA shadow weights (live model only for val/audio/metrics)
  ema_decay:  0.9999
  ema_start:  5000        # step from which EMA begins updating


# ============================================================
# INTERVALS (in training steps)
# ============================================================
intervals:
  val:     1000           # validation loss
  audio:   25000          # UNCONDITIONED preview on TB: refreshes the
                          # "uncond generation/uncond_NN" cards, the SAME
                          # cards the metrics step writes, each from the SAME
                          # starting noise (metrics.seed), so the slider of a
                          # card walks one generation through training.
                          # How many: sampling.n_audio_samples. Nothing
                          # conditioned is generated here: the test_XX/
                          # and probe_XX/ panels are written by the metrics
                          # step alone, every intervals.metrics. Skipped when
                          # the step is also a metrics step. Set very large
                          # (or equal to intervals.metrics) to disable.
  metrics: 50000          # computes FD-DAC + KL (both directions), FAD, the
                          # Condition_influence table and the panels
  ckpt:    50000          # save periodical checkpoint
  keep_last_n_ckpts: 5    # keep only the last N periodic checkpoints


# ============================================================
# SAMPLING (Euler / rectified flow)
# ============================================================
sampling:
  euler_steps: 100        # match uncond for fair cond-vs-uncond FD-DAC comparison
                          # (with CFG each step does 2 forward passes)
  t_min: 0.001
  t_max: 0.999
  # How many UNCONDITIONED generations are on TensorBoard: uncond_00,
  # uncond_01, ... in the "uncond generation" group (4 -> uncond_00..03), each
  # starting from its own draw of ONE noise stream (metrics.seed), so they are
  # all different. Written at every metrics step and refreshed every
  # intervals.audio, from the same noise.
  # In a run with NO condition at all it also says how many real recordings to
  # show ("ground truth/"), since there are no panels there.
  n_audio_samples: 4

  # ---------------------------------------------------------------
  # THE CONDITION_INFLUENCE TABLE, AND WHAT IS THERE TO LISTEN TO
  # ---------------------------------------------------------------
  # TEXT    Validation/Condition_influence   ONE panel per metrics step: a row
  #                                          per metric of every condition (ours
  #                                          or mir_eval's, see
  #                                          metrics.influence_family), columns
  #                                          with-cond, null (same noise, no
  #                                          condition), Δ = with-cond - null,
  #                                          valid/used. Means over ALL the
  #                                          n_metrics_samples validation
  #                                          generations -- the same ones
  #                                          FD-DAC / KL / FAD are computed on.
  #                                          There is no knob for it.
  #
  # The panels below are for LISTENING and LOOKING; nothing measured on them is
  # in the table:
  #   IMAGES  test_XX/<cond>_target_vs_gen   target vs re-extracted
  #           probe_XX/<cond>_target_vs_gen  idem, on the probe stimuli
  #   AUDIO   test_XX/ , probe_XX/           the recording (test only), one card
  #                                          per condition (sonified), then the
  #                                          generation conditioned on them
  # Both windows group per sample, so N panels read as N collapsible sections.
  #
  # TEST: samples of the TEST split, spread evenly over it, the same ones at
  # every step. They replace the validation panels (2 Oct 2026). 0 -> none.
  n_test_panels: 8
  # PROBE: at most 16, the size of each bank in probe_conditions.py (more ->
  # all 16, and the startup log says so). Fewer than 16 -> that many stimuli
  # drawn AT RANDOM but FIXED (probe_conditions.PROBE_SUBSET_SEED): the same
  # subset at every step and in every run. A text bank of single labels is
  # instead cycled to that length, so every label stays in. 0 -> no probe.
  n_probe_panels: 8
  #
  # COST per metrics step: one generation per panel plus one re-extraction
  # (for the images), on top of the n_metrics_samples generations.

  # ---- OUT-OF-THE-BOX PROBE PANELS ----
  # Probe panel i drives EVERY condition active in the run at once, taking the
  # i-th stimulus of each condition's own bank: the f0 of a scale, the chroma of
  # a triad, the energy of a crescendo, the rhythm of a 120 bpm grid. The banks
  # are combined BY INDEX and are therefore NOT mutually aligned -- deliberate,
  # see below. Which stimulus a panel used is written in the TITLE of that
  # panel's comparison image, in the IMAGES window.
  # Set n_probe_panels: 0 to disable.
                          #
                          # WHY JOINT. With p_drop_each_frame = 0.0 (see below)
                          # the model only ever sees all of its conditions or
                          # none, so probing one at a time with the others
                          # nulled would ask it for a subset it never saw. The
                          # joint panel presents the shape it was trained on.
                          #
                          # WHY NOT ALIGNED. The probe is an out-of-the-box
                          # controllability check on unambiguous stimuli: it
                          # shows whether this conditioning moves the
                          # generation at all. The table and the test panels
                          # carry the aligned, in-corpus case, but there a
                          # condition is often not cleanly extractable (a
                          # smeared chromagram, a beat grid that does not
                          # exist), so they cannot separate weak conditioning
                          # from an ambiguous target. They answer different
                          # questions and neither replaces the other.
                          #
                          # The stimuli live in probe_conditions.py:
                          #   f0     -> scales, arpeggios, octave leaps, ...
                          #   energy -> crescendo, diminuendo, stabs, staircases
                          #   chroma -> sustained triads, I-IV-V, clusters
                          #   rhythm -> click grids at fixed tempi
                          # Build one standalone to look at it before training:
                          #   python probe_conditions.py energy ./cache/probe_energy --n_frames 431

  # NB: older knobs that are GONE. A leftover in your own config does nothing;
  # n_influence_samples* are removed at startup with a log line, and given on
  # the command line they stop the run with the new names:
  #   n_influence_samples_valid -> gone: the table uses all n_metrics_samples;
  #                                the listening panels are n_test_panels
  #   n_influence_samples_probe -> n_probe_panels
  #   n_influence_samples       -> (the one knob for both, before 29 Sept 2026)
  #   n_probes      -> n_probe_panels
  #   n_cond_plot   -> gone: every panel is plotted
  #   n_f0_plot     -> gone (it was already only an alias of n_cond_plot)
  #   n_<cond>_probe (f0/energy/chroma/rhythm) -> gone, they were already inert

  n_metrics_samples: 512  # conditioned samples used to compute FD-DAC + KL, and
                          # the Condition_influence table on the same ones. 512 is a
                          # stable estimate for a 72-dim covariance; 1024 doubles the
                          # metrics-step TIME for a marginal statistical gain -- keep it
                          # for the final offline evaluation, not for a 1M-step run.
  # ---- AUDIO part of the metrics step (DAC decode + re-extraction) ----
  # FD-DAC/KL above are latent-only. The table needs the audio: every one of
  # the n_metrics_samples generations is DECODED ONCE, and that one waveform
  # serves the re-extraction of the conditions, the CLAP / CLIP embedding, the
  # VGGish embedding of the FAD and the disk dump. It is STREAMED -- decode one,
  # measure it, drop it -- so the RAM stays flat whatever n_metrics_samples is;
  # what grows with it is the TIME (one extractor pass per generation; CREPE
  # for f0 is the slow one, ~0.35 s per clip on a laptop GPU).
  #
  # The text / image similarity (cosine in CLAP's / CLIP's space) is a column
  # of the Condition_influence table, over these same generations. Its two
  # curves in the time series (Audio_text_similarity / Audio_image_similarity)
  # and their own sample size, n_similarity_samples, were removed on
  # 2 Oct 2026: every conditioning measure is read in the table.

  # ---- WHAT THE VALIDATION GENERATIONS ARE CONDITIONED ON (text slot) ----
  # false (default): the text slot receives the CLAP AUDIO embedding of the
  #   chunk, i.e. the same vector training uses. The table's text column is then
  #   a cosine between the generation and the SOURCE AUDIO in CLAP's space --
  #   a resemblance to the original, not an adherence to a text.
  # true: the slot receives the CLAP TEXT embedding of that sample's written
  #   description, the one preprocess_stream.py stored for every chunk
  #   (--text_labels_n: the class, plus the nearest vocabulary phrases). This is
  #   the vector a prompt would put there at inference, so the validation then
  #   measures what you will actually do with the model:
  #     * the generations are produced FROM the description;
  #     * the table's text column becomes "how close is the output to the
  #       written description", a true audio-vs-text cosine.
  # The same holds for the test panels, and for test_cond.py.
  # TRAINING IS UNTOUCHED either way, and so is the validation LOSS -- it keeps
  # the training's own conditioning, otherwise the two curves would stop being
  # comparable and would say nothing about overfitting. Only the generations the
  # metrics and the panels are built from change.
  # Needs a dataset preprocessed with --global_conds text by a version that writes
  # global_conditions/text_labels_emb.npy; without it the run says so and falls
  # back to the chunk's own vector.
  validation_text_from_caption: true

  # ---------------------------------------------------------------
  # CONDITION SUBSETS -- extra columns of the table
  # ---------------------------------------------------------------
  # Which COMBINATIONS of the active frame conditions to generate and measure
  # at each metrics step. Every subset adds its own columns to the
  # Condition_influence table, headed by its label (no_chroma, only_f0, ...):
  # the same metrics, on the n_metrics_samples generations conditioned on that
  # subset only. In the test panels each subset adds one more generation card,
  # after the one with every condition.
  #
  # Columns cover EVERY active condition, not only the ones given in that
  # subset. The off-subset columns (marked °) are the interesting ones: give f0
  # alone and watch what happens to chroma.
  #
  # Entries are either an explicit list of condition names, or a keyword:
  #   "all"        -> every active condition (the table's own columns; costs
  #                   NOTHING extra, the conditioned pass the step already runs
  #                   IS it)
  #   "loo"        -> leave-one-out: N subsets, each missing one condition. The
  #                   MARGINAL contribution of each condition at the point where
  #                   the model is actually used. This is the standard ablation.
  #   "singletons" -> N subsets, each with exactly one condition. The standalone
  #                   power of each, but far from the model's operating point.
  #
  # COST: each subset other than "all" is a FULL extra generation pass over
  # n_metrics_samples, all of them decoded and measured, so the metrics step
  # grows LINEARLY with the number of subsets. With 4 conditions, "loo" alone
  # adds 4 passes; ["loo", "singletons", "all"] adds 8. Start small and read
  # the metrics-step timing before growing.
  #
  # [] (the default) -> off: one conditioned pass, the table's own columns.
  #
  # Examples:
  #   influence_subsets: []                          # off
  #   influence_subsets: ["all", "loo"]              # the standard ablation
  #   influence_subsets: ["all", "loo", "singletons"]
  #   influence_subsets: [["f0"], ["f0", "energy"]]  # hand-picked
  influence_subsets: []
  # How many validation generations to DUMP TO DISK per metrics step (each:
  # conditions .npz + sonified conditions + conditioned .wav + unconditioned
  # .wav + real.wav), under runs/<run>/audio/step_<step>/generation_<i>/.
  n_val_save: 8
  # If true, the metrics step ALSO scores the UNCONDITIONED branch
  # distributionally and logs Fd_dac_uncond / Kl_uncond / Fad_vggish_uncond --
  # the only metrics comparable with the unconditional model. It costs a second
  # FD/KL pass and, with fad_vggish on, n_fad_samples MORE DAC decodes and VGGish
  # forwards, which is the expensive half of the metrics step.
  #
  # DEFAULT false. It is a comparison against the unconditional PROJECT, and this
  # one trains dedicated models: the number is rarely what you are reading.
  #
  # The generations without conditions themselves are produced at every
  # metrics step regardless of this flag: they are nearly free under CFG (the
  # unconditional velocity is computed at every step anyway), they are the null
  # column of the Condition_influence table (re-extracted and measured like the
  # conditioned ones: twice the audio work of the table) and the uncond.wav of
  # each dumped generation. The "uncond generation" cards are generated on
  # their own (sampling.n_audio_samples).
  metrics_uncond: false

  # How many SAMPLES the metrics step fuses into one forward. Each sample needs 3
  # rows (conditioned / cfg-null / unconditional: all three are required by the
  # CFG math, so the 3 is structural, never a knob). This ONLY changes how the
  # work is packed into forwards: the samples generated -- and therefore the
  # metric VALUES -- are the same for every value, because the noise is drawn per
  # sample. What it trades is speed against the activation peak:
  #   0 -> do NOT fuse: reference serial sampler. LOWEST VRAM, slowest.
  #        Use this if the metrics step OOMs (same numbers, no code change).
  #   1 -> 1 sample  -> batch 3   (default: fewer kernel launches than serial)
  #   2 -> 2 samples -> batch 6   (faster, ~2x the activation peak of batch 3)
  #   N -> N samples -> batch 3N
  # Raise it only after checking the peak with nvidia-smi at a metrics step.
  # Fusing needs a CFG to fuse, so the serial path runs anyway when guidance <= 1,
  # metrics_uncond=false, or no condition is active.
  metrics_samples_per_forward: 1

  # How many generations the FAD-VGGish is computed on (only when 'fad_vggish'
  # is in metrics.enabled; ignored otherwise). Each one costs a DAC decode plus
  # a VGGish forward ON TOP of everything else in the metrics step -- this is
  # the knob that bounds that extra time. The default matches
  # n_metrics_samples, so FAD and FD-DAC describe the SAME generations; lower it
  # if the metrics step gets too long. The statistics are accumulated as running
  # sums, so raising it costs time, never RAM.
  n_fad_samples: 512


# ============================================================
# METRICS
# ============================================================
# Aligned with the unconditional repo. The conditioned metrics are latent-only
# (FD-DAC + KL, both directions), computed in evaluate_and_log_metrics; the only
# knob shared with uncond is the generation seed, which fixes the metric noise
# (x0) so FD/KL are comparable across checkpoints. null = free-running.
metrics:
  # Which distributional metrics to compute at each metrics step, mirroring the
  # unconditional project's registry. Available in this (conditioned) pipeline:
  #   fd_dac     : Frechet distance on the DAC latents  (latent-only, frame-level)
  #   kl_dac     : KL in BOTH directions on DAC latents (latent-only, frame-level)
  #   fad_vggish : Frechet Audio Distance on VGGish embeddings (~0.96 s window).
  #                Scores the AUDIO, not the latent space, against real
  #                recordings -- the number the controllable-music literature
  #                reports, so it is what makes your results comparable with
  #                published ones. It DECODES the generations, so it costs a DAC
  #                decode + a VGGish forward per sample (see
  #                sampling.n_fad_samples) and needs the VGGish weights, fetched
  #                once via torch.hub. Off by default: add it to the list below.
  # (fad_encodec exists in metrics.py but is NOT wired into this pipeline:
  #  listing it is a hard error at startup rather than a silent skip.)
  # Each is computed for both axes (conditioned + unconditional -> Fd_dac_cond /
  # Fd_dac_uncond / Kl_cond / Kl_uncond). Listing a metric is an EXPLICIT request:
  # an unknown/unsupported name is a hard error at startup, not a silent skip.
  # An empty list [] turns the distributional metrics off entirely (and skips
  # building their reference); the Condition_influence table is unaffected.
  # NOTE: the two share the generated mu/covariance, so asking for both costs
  # essentially the same as asking for one -- the heavy part is fitted once.
  enabled: ["fd_dac", "kl_dac", "fad_vggish"]
  seed: 0

  # Device for the re-extraction at the metrics step (CREPE-full / beat_this /
  # CLAP-audio), i.e. what feeds the Condition_influence table.
  #   "cuda" -> GPU (default, fastest)
  #   "cpu"  -> move ONLY this part to CPU
  # FD-DAC / KL are unaffected: they always run on the GPU (see metrics.py).
  # The device does NOT change the values, only speed -- "cpu" is purely an
  # escape hatch for VRAM: at the metrics step the model and the generations are
  # resident (plus the DAC decoder itself, if dac_device below is "cuda"), and
  # CREPE-full on top can overflow a card with little margin.
  fidelity_device: "cuda"

  # ---- WHICH METRICS ARE THE COLUMNS OF THE CONDITION-INFLUENCE TABLE ----
  # Each column of Validation/Condition_influence compares the condition GIVEN
  # to the model with the same descriptor RE-EXTRACTED from what it generated.
  # Two families can do the scoring:
  #   "influence_metrics"      -> ours (DEFAULT, every run before 23 Sept 2026):
  #                               f0 Pearson on the voiced frames, chroma/chord
  #                               cosine, rhythm/energy Pearson.
  #   "mir_influence_metrics"  -> mir_eval (Raffel et al., ISMIR 2014), the
  #                               standard MIR metrics, citable and comparable
  #                               with the literature.
  # mir_eval covers f0, chroma, chord and rhythm; energy, text and image are
  # always scored with ours (mir_eval has nothing for them):
  #   f0             mir_eval.melody: raw pitch / raw chroma / overall
  #                  accuracy, voicing recall and voicing false alarm;
  #   chroma, chord  mir_eval.multipitch: chroma precision / recall /
  #                  accuracy, miss and false alarm error, on the pitch
  #                  classes that are ON (see mir_threshold below);
  #   rhythm         mir_eval.beat: beat F-measure / Cemgil / P-score /
  #                  CMLt / AMLt and downbeat F-measure, on the beat instants
  #                  beat_this's own rule reads off the curves (maximum within
  #                  +-60 ms, probability > 0.5).
  # The startup line "[metrics] extractor=<cond> | ... | metrics=..." says
  # which family each condition actually got.
  # Evaluation only -- the training is untouched. Switching it changes the
  # COLUMNS of the table, so compare runs within one family.
  influence_family: "influence_metrics"

  # ---- WHEN A PITCH CLASS COUNTS AS "ON" (chroma / chord, mir family) ----
  # mir_eval.multipitch compares the LIST of notes that are on in each frame,
  # while both conditions store 12 continuous values per frame: a class is ON
  # when its value is >= this.
  #   chroma -> at least this fraction of the frame's loudest class (every
  #             chroma frame is scaled so its loudest class is 1);
  #   chord  -> crema's probability of the class: 0.5 = more likely than not.
  # Measured on the instruments dataset at 0.5, classes ON per frame on
  # average: chroma violin 1.8, piano 2.4, guitar 3.9, drums 6.8 (drums have no
  # notes: their chroma is noise and nearly everything lights up); chord
  # violin 1.8, piano 2.5, guitar 2.2, drums 0.4 (almost always no chord).
  # FIXED ONCE: it changes the numbers, so runs compare only at the same value.
  # Ignored by f0 and by the default family.
  mir_threshold: 0.5

  # ---- DAC decoder: where the shared decoder lives for the whole run ----
  #   "cpu"  -> DEFAULT and historical behaviour. Nothing changes.
  #   "cuda" -> decode on the GPU (also "cuda:<n>")
  #
  # This is the one device knob that is NOT free, so read before flipping it.
  # Measured on an RTX 5050 laptop, decoding one 5-second clip:
  #
  #     CPU  2538 ms          CUDA  194 ms          -> 13x
  #
  # At 128 samples that is 5.4 minutes of pure decoding per metrics step against
  # 25 seconds. On a short local run the CPU decoder dominates the wall clock.
  #
  # What it costs on the GPU -- and the weights are the SMALL half:
  #
  #     weights      0.29 GB    resident for the whole run
  #     activations  0.69 GB    peak, one 5-second clip at a time
  #     peak         0.97 GB
  #
  # Nearly 1 GB, and it lands DURING the metrics step, on top of the model, the
  # generations and the re-extraction above. Training an XL on a 24 GB card --
  # weights, grads, Adam states and the EMA shadow all live -- that spike is
  # what kills a run at hour 40, and a slow metrics step is far cheaper than
  # losing days. So: leave it "cpu" on a shared/large-model machine, turn it
  # "cuda" on a small local run where the wall clock is the binding constraint.
  #
  # UNLIKE fidelity_device and fad_device, this one DOES change the values very
  # slightly (CPU and GPU floating point differ), so FD-DAC / FAD produced with
  # a GPU decoder are not directly comparable with numbers produced by a CPU
  # one. Comparable within an experiment -- all runs on the same device -- not
  # across the switch. Asking for "cuda" without CUDA is a hard error at
  # startup, not a silent fallback to CPU.
  dac_device: "cpu"

  # ---- FAD-VGGish (inert unless 'fad_vggish' is in `enabled` above) ----
  # Device for the VGGish embedder. As with fidelity_device it does not change
  # the values, only the speed.
  fad_device: "cuda"

  # WHAT the generations are compared against:
  #   "wav"     -> the REAL validation wavs on disk. This is the standard
  #                definition of FAD and the only one comparable with published
  #                numbers. It requires preprocess_stream.py to have been run
  #                with --save_wav; if the wavs are missing the run stops at
  #                startup and says so (no silent fallback).
  #   "decoded" -> the validation LATENTS decoded through DAC. Needs no wavs and
  #                works on any dataset; both sides then pass through the same
  #                codec, which isolates the model from the codec's own
  #                artifacts -- arguably a fairer measure of the MODEL, but the
  #                absolute value is NOT comparable with the literature.
  # The file list always comes from the VAL SPLIT, never from globbing the wav
  # directory: the dataset is split-less on disk, so a glob would build the
  # "real" reference on the test set as well.
  # The choice is part of the cache file name, so switching it never reuses the
  # other mode's statistics.
  fad_reference: "wav"



# ============================================================
# CONDITIONING
# ============================================================
conditioning:
  # CFG dropout (per-sample) applied during training, in two stages.
  #
  # STAGE 1 -- GROUP buckets. One coin per sample picks one of these:
  # p_drop_all + p_drop_frame + p_drop_global must be < 1.0; the remaining
  # probability mass keeps both branches active. These are the branches
  # classifier-free guidance extrapolates FROM, so their mass is reserved and
  # stage 2 never eats into it.
  p_drop_all:    0.10     # drop ALL conditions       -> pure unconditional
  p_drop_frame:  0.05     # drop only frame-level (f0 / chroma / rhythm / energy)
  p_drop_global: 0.05     # drop only global (text / image)

  # STAGE 2 -- PER-CONDITION dropout. On top of the buckets above, EVERY frame
  # condition flips its OWN independent coin at this probability, so the model
  # also trains on the partial subsets (f0 alone, f0+energy, chroma alone, ...).
  #
  # WHY: with stage 1 only, the frame conditions are always ALL present or ALL
  # absent, so asking the model for ONE condition at inference -- nulls in the
  # other slots -- is out of distribution: one slot says "conditioned", the
  # others say "unconditional", a combination never seen in training. The
  # generation still runs (network_cond.py zero-fills any missing condition)
  # but nothing guarantees the result. This is what turns partial conditioning
  # into a capability of the model.
  #
  # MUST BE DECIDED BEFORE THE RUN: it changes what the model learns and cannot
  # be added at sampling time.
  #
  # HOW BIG: with P here and N active frame conditions, a sample in the "keep"
  # bucket still carries all N with probability (1-P)^N -- at N=3, P=0.2 that
  # is 0.51, i.e. all three survive about half the time, one is dropped 38% of
  # the time, two 10%. Higher P buys subset coverage and costs joint-condition
  # signal. 0.0 disables stage 2 and restores the old behaviour exactly.
  # DEFAULT 0.0 -- the project trains DEDICATED models: one model per condition
  # combination, each seeing its own set always present or (via stage 1) fully
  # absent. Stage 2 exists for the alternative design, a single FLEXIBLE model
  # conditionable on any subset at inference; set it to 0.20 only if that is
  # what you are training. Note the two designs also want different diagnostics:
  # dedicated -> joint probe + influence_subsets: [] ; flexible -> per-condition
  # probes + influence_subsets: ["all", "loo"].
  #
  # NB this is stage 2 ONLY. p_drop_all / p_drop_frame above must stay > 0
  # whatever you choose: they are what teaches the model the NULL case, without
  # which classifier-free guidance has no v_u to extrapolate from.
  p_drop_each_frame: 0.0

  # Classifier-free guidance scale used when generating audio at validation
  # time (both for listening and for the metrics).
  #
  # NB: guidance is not the only lever on how strongly the frame conditions are
  # followed. The other one is structural and lives in `model`:
  # `model.frame_reinject_every` decides whether they are presented once at the
  # input or re-injected in depth. Unlike this scale, it has to be chosen BEFORE
  # the run.
  guidance_scale: 3.0

  # ---------------------------------------------------------------
  # WHAT THE TEXT SLOT IS FED IN TRAINING
  # ---------------------------------------------------------------
  # audio   -> the chunk's own CLAP AUDIO embedding. What every run before
  #            14 Sept 2026 did, and the AudioLDM arrangement: CLAP's two towers
  #            share a space, so a written prompt can take its place at
  #            inference. No captions needed, and the vector is rich and exact.
  # caption -> the CLAP TEXT embedding of that chunk's written description. The
  #            vector a PROMPT puts there at inference, so training and test
  #            finally see the same distribution.
  # mix     -> one or the other per sample, with probability text_mix_p of the
  #            caption. Random on train; DETERMINISTIC on val/test, so the
  #            validation loss does not wobble with the draw.
  #
  # WHY IT MATTERS (measured on dataset_ready_..._text_instruments, 14 Sept
  # 2026): audio-to-audio cosines within a class sit at +0.70..+0.82, which is
  # what the model sees in training, while a chunk's cosine to its own caption's
  # TEXT vector is +0.24..+0.52. With text_source=audio the slot is handed a
  # vector from a region it was never trained on.
  #
  # THE CROSS-ATTENTION IS NOT GOVERNED BY THIS. Its context is always the
  # caption's tokens, whatever is chosen here: CLAP's audio tower returns one
  # vector and there is no sequence to attend over.
  #
  # Needs text_labels_emb.npy (any value but 'audio' refuses to start without
  # it). Same preprocessing pass as the token sequences above.
  text_source: caption
  text_mix_p: 0.5

  # ---------------------------------------------------------------
  # Per-run SELECTION of which conditions to activate.
  # Subset of what is enabled=True in CONDITION_CONFIG (conditions.py).
  #   null  -> use all conditions marked enabled=True in CONDITION_CONFIG
  #   []    -> use NO condition of that type
  #   list  -> use only the listed names (each must be enabled=True
  #            in CONDITION_CONFIG, otherwise the registry raises)
  #
  # Examples:
  #   enabled_frame:  ["f0"]                          # pitch only
  #   enabled_frame:  ["f0", "chroma"]                # pitch + harmony
  #   enabled_frame:  ["f0", "chroma", "rhythm", "energy"]  # four frame conds
  #   enabled_frame:  ["f0", "chord"]                 # pitch + crema's chords
  #   enabled_frame:  []                              # no frame conditioning
  #   enabled_global: []                              # no text/image AdaLN
  #
  # DEFAULT: f0-only. This matches the current preprocessing line
  # (--conditions f0). Add "energy" / "chroma" / "rhythm" once you have
  # extracted them onto the dataset; the training gives an error message at the beginning otherwise
  # (see training.strict_conditions).
  # ---------------------------------------------------------------
  enabled_frame:  ["f0"]
  enabled_global: []


# ============================================================
# PATHS
# ============================================================
paths:
  # Output of preprocess_stream.py (+ extract_conditions.py to add a condition later)
  dataset_root:   "./dataset_ready_cond/latents"
  wav_root:       "./dataset_ready_cond/wav"
  condition_root: "./dataset_ready_cond/conditions"

  # Where the train/val/test split is read from. null = the dataset's own
  # (<dataset_root>/../splits.json), which is what preprocess_stream.py writes.
  # Only set this to point a run at a split file kept elsewhere.
  splits_path:    null

  # Class-organised image folders (image_root/<class>/*.jpg)
  # Read ONLY to display the conditioning picture in the test panels --
  # the embeddings themselves come from the dataset's own
  # global_conditions/image/ bank, built once by preprocess_stream.py. A wrong
  # or missing path costs the image CARDS, nothing else.
  image_root:     "./Museart_2_reduced/Images"

  # Portable defaults (relative to the working dir). On IRCAM, override with the
  # shared absolute paths, e.g. on the CLI:
  #   paths.runs_dir=/data/anasynth_nonbp/baione/runs \
  #   paths.cache_dir=/data/anasynth_nonbp/baione/cache
  # or keep an IRCAM profile in configs/cond_ircam.yaml.
  #
  # Shared among all runs; the specific run is in runs_dir/<run_name>/
  runs_dir:       "./runs"

  # Shared cache among runs over the same dataset (normalizer, FD-DAC + KL reference).
  # Computed once, reused by all subsequent runs.
  cache_dir:      "./cache"

  # Where the out-of-the-box f0 probe set (synthesized melodies + their f0
  # targets) is built and cached. null -> <cache_dir>/f0_probe. Like the other
  # caches it is keyed by a fingerprint (melodies + chunk geometry + f0
  # extractor parameters), so it rebuilds itself when any of those change.
  # Build it standalone to inspect it before training:
  #   python probe_conditions.py f0 ./cache/f0_probe --n_frames <N> --device cuda
  # (the other three banks the same way: energy | chroma | rhythm, each
  #  cached under cache_dir/probe_<cond>)
  f0_probe_dir:   null

  # Name of the run (folder under runs_dir/).
  # Priority: CLI --run_name > YAML run_name > self-generated timestamp.
  # The adopted value is written here after load, so the dumped config.yaml
  # always has it.
  run_name:       null

  # Checkpoint path to resume from (override also from --resume CLI).
  # When resuming, a new run starts; the config registers resume_from.
  resume_from:    null

  # WARM START: a NEW run that begins from another run's weights. Not a resume --
  # step counter, optimizer, scheduler and RNG all start from zero, and only the
  # model and the EMA shadow are seeded. This is how model.text_cross_every is
  # turned on for an already-trained model: the cross-attention's output
  # projection is zero-initialised, so the warm-started model computes exactly
  # the function the checkpoint had.
  # Only weights the NEW architecture adds may be missing; anything else is
  # refused with the list of keys, rather than left at its random init behind a
  # line that says "warm start".
  # Mutually exclusive with resume_from.
  init_from:      null
