# Training of the conditioned DiT (training_cond.py). Every key can be
# overridden on the command line, e.g. training.lr=2e-4.

model:
  kind: 'S'                  # S | B | G | L | XL
  duration_s: 5.0
  drop: 0.0                  # FFN dropout, 0 = off
  frame_reinject_every: 1    # 0 = off; N = every N blocks
  text_conditioning: ada     # ada | cross_att | all
  attention: standard        # standard | differential
  qk_norm: true
  memory_tokens: 64          # 0 = off
  t_features: high_freq      # high_freq | low_freq
  adaln: shared              # shared | per_block

data:
  train_batch_size: 8
  val_batch_size: 16
  grad_accum: 1
  num_val_batches: 89
  validation_shuffle: true
  validation_seed: 12345
  num_workers: 4             # 0 on Windows

training:
  num_steps: 1000001
  optimizer: muon            # muon | adamw
  lr: 5.0e-5                 # adamw: every parameter; muon: parameters with ndim < 2
  muon_lr: 1.0e-3            # muon: parameters with ndim >= 2
  muon_momentum: 0.95
  lr_schedule: inverse_power # inverse_power | cosine | constant
  lr_inv_gamma: 1.0e6
  lr_power: 0.5
  lr_warmup: 0.995           # inverse_power: 1 - x^(step + 1); 0 = linear over warmup_steps
  seed: 42
  strict_conditions: true    # false = missing conditions zero-filled (debug only)
  weight_decay: 0.01
  weight_decay_matrices_only: true   # adamw only
  adam_betas: [0.9, 0.95]
  adam_eps: 1.0e-8
  grad_clip:    0.0          # 0 = off
  use_amp:      false
  t_sampler: truncated_logit # logit_normal | truncated_logit | uniform
  ot_coupling: true
  warmup_steps: 5000
  decay_start_frac: 0.8      # cosine only
  use_ema:    true
  ema_decay:  0.9995
  ema_start:  0
  ema_power:  0.75           # decay = min(ema_decay, 1 - (1 + n)^-power); 0 = constant
  inpainting: false
  inpaint_masks: [0.8, 0.1, 0.05, 0.05]   # full mask, random spans, continuation, backward continuation

intervals:
  val:     1000
  audio:   25000
  metrics: 50000
  ckpt:    50000
  keep_last_n_ckpts: 5

sampling:
  euler_steps: 50
  t_schedule: logsnr_uniform # uniform | logsnr_uniform
  guidance_type: apg         # cfg | apg | mix
  n_audio_samples: 4
  n_test_panels: 8
  n_probe_panels: 8
  n_metrics_samples: 512
  validation_text_source: null  # null = text_source | audio | label | text
  influence_subsets: []      # [] = off | ["all", "loo", "singletons"] | [["f0"], ["f0", "energy"]]
  metrics_uncond: false
  metrics_samples_per_forward: 1   # 0 = serial sampler; N = N samples per forward
  n_fad_samples: 512

metrics:
  enabled: ["fd_codec", "kl_codec", "fad_vggish"]
  seed: 0
  fidelity_device: "cuda"    # cuda | cpu
  influence_family: "influence_metrics"   # influence_metrics | mir_influence_metrics
  mir_threshold: 0.5
  codec_device: "cpu"        # cpu | cuda
  fad_device: "cuda"
  fad_reference: "wav"       # wav | decoded

conditioning:
  p_drop_all:    0.10
  p_drop_frame:  0.05
  p_drop_global: 0.05
  p_drop_each_frame: 0.0     # > 0 = each frame condition also dropped alone
  guidance_scale: 3.0
  text_source: label         # audio | label | text
  enabled_frame:  ["f0"]     # f0, chroma, rhythm, energy, chord, midi
  enabled_global: []         # text, image

lora:
  adapter: null              # null = off | lora | dora-rows; needs paths.init_from, paths.normalizer_from
  rank: 16
  targets: all               # attention | blocks | all
  lr: 1.0e-4

paths:
  dataset_root:   "./dataset_ready_cond/latents"
  wav_root:       "./dataset_ready_cond/wav"
  condition_root: "./dataset_ready_cond/conditions"
  splits_path:    null       # null = <dataset>/splits.json
  image_root:     "./Museart_2_reduced/Images"
  runs_dir:       "./runs"
  cache_dir:      "./cache"
  f0_probe_dir:   null
  run_name:       null
  resume_from:    null
  init_from:      null       # warm start; not with resume_from; with lora: the base model
  normalizer_from: null      # lora only: normalizer.pt of the base model
