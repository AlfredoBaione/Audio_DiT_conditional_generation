# Preprocessing (preprocess_stream.py). Every key is also a command-line flag
# with the same name, which wins over this file.

source_dir: "./Entire_music_reduced"
output_dir: "./dataset_ready_cond"

# chunking (part of the dataset identity)
codec:           "dac_44khz"   # dac_44khz (72-d, 86.13 frames/s) | encodec_32khz (128-d, 50 frames/s)
sr:              null          # null = the codec's own rate
chunk_duration:  5.0
chunk_overlap:   0.0
duration:        null          # trim each source to N seconds
min_duration:    null          # drop sources shorter than this
pad_last_chunk:  false
keep_num_chunks_per_file: null

# file / chunk gates
silence_threshold: null
max_silence_ratio: null
peak_threshold:    1.0
max_peak_ratio:    null
no_clip:           false
chunk_min_rms:     null
chunk_min_peak:    null

# acoustic treatment: true = silence trim + loudness normalization + stereo split
acoustic_rules:   false
target_lufs:      -18.0
target_tp:        -1.0
target_lra:       20.0
silence_trim_db:  -55.0
silence_thresh_db: -60.0
no_stereo_split:  false
min_chunk_sec:    null

# split (written once to OUT/splits.json)
split_ratios: "0.8,0.1,0.1"
split_seed:   42
no_stratify:  false            # true = one global bucket instead of per-class balance
resplit: false                 # true = redecide the whole split
split_only:          false     # true = only create/extend splits.json
import_legacy_split: false

# outputs
save_wav: "none"               # "none" | "all" | splits, e.g. "val"
conditions: null               # e.g. "f0,chroma,rhythm,energy,chord,midi" (midi: song.mid next to the audio)
global_conds: null             # "text" | "image" | "text,image"
image_root:   null             # image_root/<class>/*.jpg
text_vocab:   null             # phrase file, one per line; null = built-in vocabulary
text_labels_n: 2               # terms of the per-chunk text: 1 = class, 2 = class + nearest phrase, ...
single_class: false
class_name:   null
label_source: "dir"            # "dir" (class = folder) | "csv"
label_csv:    null             # for label_source: csv

# execution
device:      "cuda"
cond_device: null              # null = same as device
skip_dac:    false             # true = everything but the codec encode
num_workers:       4
batch_size:        16
loader_batch_size: 8
prefetch_factor:   1
worker_start_method: "spawn"
force: false                   # true = recompute the chunks this run meets
prune_orphans: false           # true = delete outputs of sources no longer on disk
